name: Compose OpenAPI

# Fold each surface's per-service spec into ONE composite PER AUDIENCE (published/<audience>-api.json).
# A surface directory is named `<service>-<audience>` (e.g. appointments-api-public), so the audience is
# the segment after the final `-`. All specs sharing an audience compose into that audience's composite.
#
# Composition itself is bin/compose (run it locally the same way CI does). Model and tag names are NOT
# prefixed: a schema shared by several specs of one audience is unified into a single model, and divergent
# shapes under one name hard-fail the publish. Per-audience documentation overlays live in
# canonical/<audience>/<Name>.json -- never shared across audiences.
#
# Trigger is scoped to specs/** and canonical/** so the workflow's own commit to published/** does NOT
# retrigger it.
on:
  push:
    branches:
      - main
    paths:
      - 'specs/**'
      - 'canonical/**'
      - 'bin/compose'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compose-openapi
  cancel-in-progress: false

jobs:
  compose:
    name: Compose per-audience specs
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — nbgv computes the version from full commit history, so the version step needs it.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The composite's version is THIS repo's nbgv version — the store is its own artifact with its own
      # lifecycle, NOT any single downstream service's build. Computed ONCE here (before the compose commit)
      # and reused for both info.version (stamped into each composite below) and the immutable git tag, so
      # the two always agree. version.json's pathFilters exclude published/**, so the bot's own compose
      # commits do not inflate the height — the number counts real spec revisions and is stable on re-runs.
      #
      # NOTE: this deliberately does NOT use the shared
      # SymplastLLC/devops-actions/.github/actions/calculate-version action, even though nearly every other
      # repo in the org does. GitHub does not allow a PUBLIC repository to consume an action from a PRIVATE
      # repository, even within the same org — devops-actions is private and this repo is public (it must be,
      # so the dev portal can fetch published/** over raw.githubusercontent.com). Referencing it fails the job
      # at "Set up job" with `Unable to resolve action symplastllc/devops-actions, not found`, before any step
      # runs. Every repo using that action successfully is private. Do not "restore consistency" here without
      # first making devops-actions public.
      #
      # So this replicates what that action does — `nbgv get-version --variable Semver2` — inline, and keeps
      # the nbgv install (the shared action relies on nbgv being preinstalled on the runner; installing it
      # here is idempotent and removes that dependency on the runner image).
      #
      # Semver2 is deliberate: combined with version.json's publicReleaseRefSpec it is a clean
      # `0.1.<height>` ONLY on main, and carries a `-g<commit>` suffix on every other ref, so a
      # workflow_dispatch from a feature branch cannot publish a version that looks like a release.
      - name: Resolve composite version (this repo's nbgv)
        id: ver
        run: |
          set -euo pipefail
          dotnet tool install --global nbgv >/dev/null 2>&1 || dotnet tool update --global nbgv >/dev/null 2>&1
          export PATH="$PATH:$HOME/.dotnet/tools"
          version="$(nbgv get-version --variable Semver2)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Composite version (this repo's nbgv Semver2): $version"

      # All composition logic lives in bin/compose so it can be run locally exactly as CI runs it:
      #   COMPOSITE_VERSION=0.0.0-local bin/compose
      # The script hard-fails (and publishes nothing) when two specs of the same audience define the same
      # schema name with different shapes -- see its header for the full policy.
      - name: Compose per-audience composites
        id: compose
        env:
          COMPOSITE_VERSION: ${{ steps.ver.outputs.version }}
        run: bin/compose

      # Runs even when count=0 (every surface was deleted): the compose step already cleared the composites
      # from the working tree, so this commits their REMOVAL. The `git diff --cached --quiet` guard makes it
      # a genuine no-op when there is nothing to change (empty store / unchanged composites).
      - name: Commit composites
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A so composite additions, updates, AND removals (stale audiences / last surface deleted) are
          # all captured.
          git add -A published
          if git diff --cached --quiet; then
            echo "No composite changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore: compose per-audience openapi specs"
          git push

      # Stamp the current composites with an immutable, nbgv-derived version tag (e.g. v0.1.7) so the dev
      # portal can pin a specific spec version — `raw.githubusercontent.com/.../v0.1.7/published/public-api.json`
      # — instead of the moving `main`. Promotion becomes a portal values-file bump of the pinned tag.
      #
      # Gated on "specs exist", NOT on "committed this run": if a prior run pushed the composite commit but
      # then failed before tagging, HEAD already carries that commit and a re-run would see committed=false —
      # so gating on committed would leave it permanently untagged. Running always + the tag-exists guard
      # below is idempotent: it tags HEAD when missing and no-ops when the tag is already there.
      - name: Tag published composites
        if: steps.compose.outputs.count != '0'
        env:
          COMPOSITE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Reuse the version resolved BEFORE the compose commit, so the tag matches the info.version stamped
          # into the composites (recomputing here would count the bot's own compose commit and drift +1).
          tag="v${COMPOSITE_VERSION}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to push."
          else
            git tag -a "${tag}" -m "Published composites ${tag}"
            git push origin "${tag}"
            echo "Tagged published composites as ${tag}"
            echo "Portal reference: https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${tag}/published/public-api.json"
          fi
