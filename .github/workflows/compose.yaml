name: Compose OpenAPI

# Fold every per-service spec (specs/*/openapi.json) into ONE unified document (published/openapi.json).
# Trigger is scoped to specs/** so the workflow's own commit to published/** does NOT retrigger it.
on:
  push:
    branches:
      - main
    paths:
      - 'specs/**'
  workflow_dispatch:

# Single placeholder server for now. Per-env promotion (dev/uat/prod) is deferred — when it lands this
# becomes a per-env fan-out. Keep as one URL until then.
env:
  SERVER_URL: https://public-api.dev.symplast.cloud

permissions:
  contents: write

concurrency:
  group: compose-openapi
  cancel-in-progress: false

jobs:
  compose:
    name: Compose unified spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect service specs
        id: collect
        run: |
          set -euo pipefail
          mapfile -t specs < <(find specs -mindepth 2 -maxdepth 2 -name openapi.json | sort)
          if [ ${#specs[@]} -eq 0 ]; then
            echo "No specs found under specs/*/openapi.json; nothing to compose."
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "${specs[@]}"
          echo "count=${#specs[@]}" >> "$GITHUB_OUTPUT"
          # Persist the list for later steps (space-separated is fine — paths have no spaces).
          echo "specs=${specs[*]}" >> "$GITHUB_OUTPUT"

      - name: Compose unified spec
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          read -r -a specs <<< "${{ steps.collect.outputs.specs }}"
          mkdir -p published

          if [ "${#specs[@]}" -eq 1 ]; then
            # redocly join requires >= 2 inputs. With a single service there is nothing to merge — the
            # service spec IS the composite. Copy it through verbatim.
            echo "Single service spec (${specs[0]}); copying through without join."
            cp "${specs[0]}" published/openapi.json
          else
            # Default: NO --prefix-components-with-info-prop, so byte-identical shared component schemas
            # (Int32, Boolean, String, DateTime, List*, ...) de-duplicate to a single entry. Services own
            # distinct path prefixes, so paths never collide; --prefix-tags-with-info-prop only namespaces
            # tags. redocly join exits non-zero ONLY on a genuine conflict (same component name, different
            # definition) — in that case retry WITH per-service component prefixing to disambiguate.
            if ! npx --yes @redocly/cli@1 join "${specs[@]}" \
                  --prefix-tags-with-info-prop title \
                  -o published/openapi.json; then
              echo "::warning::Component name conflict detected; retrying with per-service component prefixing."
              npx --yes @redocly/cli@1 join "${specs[@]}" \
                --prefix-tags-with-info-prop title \
                --prefix-components-with-info-prop title \
                -o published/openapi.json
            fi
          fi

          # Set the single placeholder server on the composite (per-env promotion is deferred).
          tmp="$(mktemp)"
          jq --arg url "$SERVER_URL" '.servers = [{ "url": $url }]' published/openapi.json > "$tmp"
          mv "$tmp" published/openapi.json

          echo "Composed published/openapi.json:"
          jq '{ openapi, info, servers, pathCount: (.paths | keys | length), schemaCount: (.components.schemas // {} | keys | length) }' published/openapi.json

      - name: Commit composite
        if: steps.collect.outputs.count != '0'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- published/openapi.json; then
            echo "published/openapi.json unchanged; nothing to commit."
            exit 0
          fi
          git add published/openapi.json
          git commit -m "chore: compose unified openapi.json"
          git push
